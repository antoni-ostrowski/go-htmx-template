[tools]
go = "1.27.4"
"aqua:a-h/templ" = "v0.3.1020"
"aqua:air-verse/air" = "v1.67.4"
"go:github.com/axadrn/shadcn-templ/v2/cmd/shadcn-templ" = "v2.0.0"
"github:tailwindlabs/tailwindcss" = "v4.3.3"

[env]
_.file = ".env.local"

[tasks.generate]
description = "Generate templ code"
run = "templ generate"

[tasks.css-dev]
description = "Build Tailwind CSS (unminified, readable for dev)"
run = "tailwindcss -i ./static/css/input.css -o ./static/css/app.css"

[tasks.css-prod]
description = "Build Tailwind CSS (minified, for prod builds)"
run = "tailwindcss -i ./static/css/input.css -o ./static/css/app.css --minify"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.lint]
description = "Lint all packages"
run = "go vet ./..."

[tasks.check]
description = "Run generators, then lint and tests in parallel"
depends = ["generate"]
run = "mise run lint ::: test"

[tasks.test-race]
description = "Run tests with race detector"
run = "go test -race ./..."

[tasks.dev]
description = "Run the web app with hot reload (PocketBase on :8080, ./pb_data, dev superuser seeded)"
env = { APP_ENV = "dev" }
run = "if command -v slogc >/dev/null 2>&1; then air 2>&1 | slogc; else air; fi"

[tasks.build]
description = "Build the prod binary (minified CSS)"
depends = ["generate", "css-prod"]
run = "go build -o ./tmp/app ."

[tasks.superuser]
description = "Create a PB superuser (Dashboard access at /_/). Usage: mise run superuser -- you@example.com"
run = "go run . superuser create"

[tasks.migrate]
description = "Run pending PocketBase migrations. Usage: mise run migrate -- up"
run = "go run . migrate"
